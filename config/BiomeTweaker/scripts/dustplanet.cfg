dustPlanet = forBiomes(10)

dustPlanet.removeDicType("COLD")
dustPlanet.removeDicType("OCEAN")
dustPlanet.removeDicType("SNOWY")

dustPlanet.addDicType("HOT")
dustPlanet.addDicType("DRY")
dustPlanet.addDicType("SANDY")

dustPlanet.set("name", "Dust Planet")
dustPlanet.set("temperature", 2.0)
dustPlanet.set("topBlock", "exnihilo:dust")
dustPlanet.set("fillerBlock", "exnihilo:dust")
dustPlanet.set("enableRain", false)
dustPlanet.set("enableSnow", false)